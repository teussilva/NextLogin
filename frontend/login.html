<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- 1. LINK DO BOOTSTRAP CSS-->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 1. LINK DO style.css-->
    <link rel="stylesheet" href="./styles/style.css">
      <!-- 2. LINK DO BOOTSTRAP JAVASCRIPT CORRIGIDO (Agora completo) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./js/login.js" defer></script>
</head>

<body>

    <main class="auth-container">
        <div class="auth-content w50">
            <!-- <div class="auth-content-left">
                <div class="auth-main-logo">
                    <img src="./img/NextLogin-logo-nova.png" alt="Logo NextLogin" title="Logo NextLogin">
                </div>
            </div> -->
            <div class="auth-content-center">
                <h2>Login</h2>
                <div class="alert" role="alert" aria-live="polite" id="msg-usuario-login"></div>
                <div class="auth-form-login">
                    <form id="formLogin" method="post">
                        <div class="form-input input-email">
                            <input type="email" name="email" placeholder="email" id="email">
                        </div>
                        <div class="form-input input-password">
                            <input type="password" name="senha" placeholder="Senha" id="senha">
                        </div>
                        <div class="btn-login-wrapper">
                            <button type="submit" id="btn-login">Entrar</button>
                        </div>
                        <a class="btn-fazer-cadastro" href="./cadastro.html">Criar sua conta?</a>
                    </form>
                </div>
            </div>
        </div>
    </main>


</body>

</html>
