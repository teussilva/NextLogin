<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <!-- <script src="/frontend/scripts/api-mock-cadastro.js" defer></script> -->
    <!-- Link css Global -->
     <link rel="stylesheet" href="/frontend/styles/global.css">
</head>
<body>

    <main class="auth-container">
        <div class="auth-content">
            <div class="auth-content-left">
                <div class="auth-main-logo">
                    <img src="../img/NextLogin-logo.png" alt="Logo NextLogin" title="Logo NextLogin">
                </div>
                <h1>Seja bem-vindo!</h1>
            </div>
            <div class="auth-content-right">
                <h2>Login</h2>
                <!-- <p class="msg-usuario hidden" id="msg-usuario">Usuario Cadastrado com sucesso</p> -->
                <div class="auth-form-login">
                    <form action="#" id="formLogin">
                        <div class="form-input input-email">
                            <input type="email" name="email" placeholder="email" id="email">
                        </div>
                        <div class="form-input input-password">
                            <input type="password" name="senha" placeholder="Senha" id="senha">
                        </div>

                        <div id="btn-login">
                             <button type="submit">Cadastrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
