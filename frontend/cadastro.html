<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <!-- Link css Global -->
     <link rel="stylesheet" href="/frontend/styles/global.css">
     <script src="./js/cadastro.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <div class="auth-content">
            <div class="auth-content-left">
                <div class="auth-main-logo">
                    <img src="/frontend/img/NextLogin-logo-nova.png" alt="Logo NextLogin" title="Logo NextLogin">
                </div>
            </div>
            <div class="auth-content-right">
                <h2>Cadastrar</h2>
                <p class="msg-usuario hidden" id="msg-usuario">Usuario Cadastrado com sucesso</p>
                <div class="auth-form-cadastro">
                    <form id="formCadastro">
                        <div class="form-input input-nome">
                            <input type="text" name="nome" placeholder="Nome completo" id="nome">
                        </div>
                        <div class="form-input input-email">
                            <input type="email" name="email" placeholder="email" id="email">
                            <p id="msg-email"></p>
                        </div>
                        <div class="form-input input-foto">
                            <label for="foto">Escolha uma foto de Perfil</label><br>
                            <input type="file" name="foto" id="foto" accept="image/*">
                        </div>
                        <div class="form-input input-password">
                            <input type="password" name="senha" placeholder="Senha" id="senha">
                        </div>
                         <div class="form-input input-cargo">
                            <input type="text" name="cargo" placeholder="Cargo" id="cargo">
                        </div>
                        <div id="btn-cadastrar">
                             <button type="submit">Cadastrar</button>
                        </div>
                    </form>
                    <a href="./login.html">Faça login</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
